<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AXEL | تتبع الطلب</title><link rel="stylesheet" href="css/style.css"></head>
<body class="track-page"><div class="form-wrap"><form id="trackForm" class="form-card track-card"><div class="checkout-head"><img src="assets/logo/logo.png" class="brand-logo" alt="AXEL"><h1>تتبع الطلب</h1><p>اكتب رقم الطلب ورقم الهاتف لمعرفة حالته</p></div><div class="checkout-section"><label for="code">رقم الطلب</label><input id="code" required placeholder="AX-XXXX" autocomplete="off"><label for="phone">رقم الهاتف</label><input id="phone" required inputmode="tel" placeholder="01xxxxxxxxx" autocomplete="tel"></div><button class="btn checkout-submit" type="submit">تتبع الطلب</button><div id="result" class="track-result"></div><a class="btn secondary full-btn" href="index.html">العودة للموقع</a></form></div>
<script type="module">import{API_URL}from'./js/config.js';const form=document.getElementById('trackForm'),code=document.getElementById('code'),phone=document.getElementById('phone'),result=document.getElementById('result');const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));form.onsubmit=async e=>{e.preventDefault();result.className='track-result loading';result.textContent='جاري البحث...';try{const r=await fetch(`${API_URL}/orders/track?code=${encodeURIComponent(code.value.trim())}&phone=${encodeURIComponent(phone.value.trim())}`),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'لم يتم العثور على الطلب');const o=d.order;result.className='track-result';result.innerHTML=`<div class="track-box"><div><span>الطلب</span><b>${esc(o.orderCode)}</b></div><div><span>المنتج</span><b>${esc(o.productName)}</b></div><div><span>الحالة</span><b>${esc(o.status)}</b></div><div><span>الدفع</span><b>${esc(o.paymentStatus)}</b></div><div><span>التفاصيل</span><b>${esc(o.color)} · ${esc(o.size)} · ${esc(o.quantity)} قطعة</b></div><div><span>الإجمالي</span><b>${esc(o.total)} جنيه</b></div></div>`}catch(err){result.className='track-result error';result.textContent=err.message}};</script></body></html>
