<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AXEL | تتبع الطلب</title><link rel="stylesheet" href="css/style.css"></head><body><div class="form-wrap"><form id="trackForm" class="form-card"><img src="assets/logo/logo.png" class="brand-logo"><h2>تتبع الطلب</h2><input id="code" required placeholder="رقم الطلب مثل AX-XXXX"><input id="phone" required inputmode="tel" placeholder="رقم الهاتف"><button class="btn">تتبع الطلب</button><div id="result"></div><a class="btn" href="index.html">الرئيسية</a></form></div><script type="module">import{API_URL}from'./js/config.js';trackForm.onsubmit=async e=>{e.preventDefault();result.textContent='جاري البحث...';try{const r=await fetch(`${API_URL}/orders/track?code=${encodeURIComponent(code.value)}&phone=${encodeURIComponent(phone.value)}`);const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error);const o=d.order;result.innerHTML=`<h3>${o.productName}</h3><p>الحالة: ${o.status}</p><p>الدفع: ${o.paymentStatus}</p><p>${o.color} - ${o.size} - ${o.quantity} قطعة</p><p>الإجمالي: ${o.total} جنيه</p>`;}catch(err){result.textContent=err.message;}};</script></body></html>
