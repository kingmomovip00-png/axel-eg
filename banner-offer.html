<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AXEL | عرض خاص</title><link rel="stylesheet" href="css/style.css"></head><body class="banner-offer-page"><div id="axelSplash" class="axel-splash"><img src="assets/logo/logo.png" alt="AXEL"><div class="splash-typing">Welcome to AXEL</div></div><main class="container offer-product"><a class="back-link" href="index.html">العودة للموقع</a><div class="offer-product-card"><img id="offerImage" class="product-main" alt=""><div class="product-info"><p class="eyebrow">LIMITED OFFER</p><h1 id="offerName">جاري التحميل...</h1><div id="offerPrice" class="price"></div><p id="offerStock"></p><h3>المقاس</h3><div id="offerSizes" class="options"></div><div class="coupon-box"><label>كود الخصم <input id="offerCoupon" placeholder="اكتب الكود"></label><button id="applyOfferCoupon" class="btn secondary" type="button">تطبيق</button><small id="offerCouponMsg"></small></div><button id="offerBuy" class="btn buy-btn" disabled>اطلب الآن</button><div class="policy-box"><details open><summary>سياسة الشحن</summary><p>مدة الشحن من يومين إلى 3 أيام</p></details><details><summary>سياسة الاستبدال والاسترجاع</summary><p>خلال 24 ساعة من استلام المنتج مع إبلاغنا بالمشكلة وسببها</p></details></div></div></div></main><script src="js/splash.js"></script><script type="module">import {API_URL} from './js/config.js'; const q=new URLSearchParams(location.search),bid=q.get('banner');const $=s=>document.querySelector(s);let b,p,size='',coupon='';const money=n=>new Intl.NumberFormat('ar-EG',{maximumFractionDigits:0}).format(n||0)+' ج';const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function showCoupon(x){$('#offerCouponMsg').textContent=x}async function validateCoupon(){const sub=Number(b.offerPrice||0);const code=$('#offerCoupon').value.trim();if(!code){coupon='';showCoupon('');return true}const r=await fetch(`${API_URL}/coupons/validate?code=${encodeURIComponent(code)}&subtotal=${sub}`),d=await r.json();if(!r.ok||!d.ok){showCoupon(d.error||'الكود غير صالح');return false}coupon=code.toUpperCase();showCoupon(`خصم ${money(d.coupon.discount)}`);return true}async function load(){if(!bid){$('#offerName').textContent='العرض غير موجود';return}const r=await fetch(`${API_URL}/banners/${encodeURIComponent(bid)}`),d=await r.json();if(!r.ok||!d.ok||!d.banner.productId||!Number(d.banner.offerPrice)){throw Error(d.error||'العرض غير موجود')}b=d.banner;const pr=await fetch(`${API_URL}/products/${encodeURIComponent(b.productId)}`),pd=await pr.json();if(!pr.ok||!pd.ok)throw Error('المنتج غير موجود');p=pd.product;$('#offerName').textContent=p.name||'منتج AXEL';$('#offerPrice').textContent=money(b.offerPrice);const color=b.offerColor||p.colors?.[0]||'';const imgs=(p.images||[]).filter(x=>!x.color||x.color===color);$('#offerImage').src=(imgs[0]||p.images?.[0])?.url||'';function render(){const available=Number(p.stock?.[color]?.[size]||0);$('#offerStock').textContent=available?`المتاح: ${available} قطعة`:'نفذت الكمية';$('#offerBuy').disabled=!available;$('#offerSizes').innerHTML=(p.sizes||['M','L','XL','XXL']).map(z=>{const q=Number(p.stock?.[color]?.[z]||0);return `<button type="button" class="option ${z===size?'active':''}" data-size="${esc(z)}" ${q<=0?'disabled':''}>${esc(z)}</button>`}).join('')}const first=(p.sizes||[]).find(z=>Number(p.stock?.[color]?.[z]||0)>0);size=first||p.sizes?.[0]||'M';render();$('#offerSizes').onclick=e=>{const x=e.target.closest('[data-size]');if(x&&!x.disabled){size=x.dataset.size;render()}}}$('#applyOfferCoupon').onclick=()=>validateCoupon().catch(()=>showCoupon('تعذر التحقق من الكود'));$('#offerBuy').onclick=async()=>{if(!(await validateCoupon()))return;location.href=`checkout.html?id=${encodeURIComponent(p.id)}&color=${encodeURIComponent(color)}&size=${encodeURIComponent(size)}&quantity=1&bannerId=${encodeURIComponent(bid)}&coupon=${encodeURIComponent(coupon)}`};}load().catch(e=>$('#offerName').textContent=e.message);</script></body></html>
