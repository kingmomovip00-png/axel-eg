<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AXEL | عرض خاص</title><link rel="stylesheet" href="css/style.css"></head><body class="banner-offer-page"><div id="axelSplash" class="axel-splash"><img src="assets/logo/logo.png" alt="AXEL"><div class="splash-typing">Welcome to AXEL</div></div><main class="container offer-product"><a class="back-link" href="index.html">العودة للموقع</a><div class="offer-product-card"><img id="offerImage" class="product-main" alt=""><div class="product-info"><p class="eyebrow">LIMITED OFFER</p><h1 id="offerName">جاري التحميل...</h1><div id="offerPrice" class="price"></div><p id="offerStock"></p><h3>المقاس</h3><div id="offerSizes" class="options"></div><div class="coupon-box"><label>كود الخصم <input id="offerCoupon" placeholder="اكتب الكود"></label><button id="applyOfferCoupon" class="btn secondary" type="button">تطبيق</button><small id="offerCouponMsg"></small></div><button id="offerBuy" class="btn buy-btn" disabled>اطلب الآن</button><div class="policy-box"><details open><summary>سياسة الشحن</summary><p>مدة الشحن من يومين إلى 3 أيام</p></details><details><summary>سياسة الاستبدال والاسترجاع</summary><p>خلال 24 ساعة من استلام المنتج مع إبلاغنا بالمشكلة وسببها</p></details></div></div></div></main><script src="js/splash.js"></script><script type="module">
import {API_URL} from './js/config.js';
const q=new URLSearchParams(location.search);
const bid=q.get('banner')||'';
const hintedProduct=q.get('product')||'';
const hintedPrice=Number(q.get('price')||0);
const hintedColor=q.get('color')||'';
const $=s=>document.querySelector(s);
let b=null,p=null,size='',coupon='';
const money=n=>new Intl.NumberFormat('ar-EG',{maximumFractionDigits:0}).format(Number(n)||0)+' ج';
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function showCoupon(x){$('#offerCouponMsg').textContent=x||''}
function showError(msg){
  $('#offerName').textContent=msg||'تعذر تحميل العرض';
  $('#offerPrice').textContent='';
  $('#offerStock').textContent='';
  $('#offerSizes').innerHTML='';
  $('#offerBuy').disabled=true;
}
async function fetchJson(url,timeout=9000){
  const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),timeout);
  try{
    const r=await fetch(url,{headers:{Accept:'application/json'},cache:'no-store',signal:controller.signal});
    let d=null; try{d=await r.json()}catch{}
    if(!r.ok) throw Error(d?.error||`HTTP ${r.status}`);
    return d;
  } finally { clearTimeout(timer); }
}
async function validateCoupon(){
  const sub=Number(b?.offerPrice||hintedPrice||0);
  const code=$('#offerCoupon').value.trim();
  if(!code){coupon='';showCoupon('');return true}
  try{
    const d=await fetchJson(`${API_URL}/coupons/validate?code=${encodeURIComponent(code)}&subtotal=${sub}`);
    if(!d.ok) throw Error(d.error||'الكود غير صالح');
    coupon=code.toUpperCase();showCoupon(`خصم ${money(d.coupon.discount)}`);return true;
  }catch(e){showCoupon(e.message||'تعذر التحقق من الكود');return false}
}
function render(){
  const color=b?.offerColor||hintedColor||p.colors?.[0]||p.images?.find(x=>x.color)?.color||'';
  const available=Number(p.stock?.[color]?.[size]||0);
  $('#offerStock').textContent=available?`المتاح: ${available} قطعة`:'نفذت الكمية';
  $('#offerBuy').disabled=!available;
  $('#offerSizes').innerHTML=(p.sizes?.length?p.sizes:['M','L','XL','XXL']).map(z=>{
    const q=Number(p.stock?.[color]?.[z]||0);
    return `<button type="button" class="option ${z===size?'active':''}" data-size="${esc(z)}" ${q<=0?'disabled':''}>${esc(z)}</button>`;
  }).join('');
  $('#offerSizes').onclick=e=>{const x=e.target.closest('[data-size]');if(x&&!x.disabled){size=x.dataset.size;render()}};
}
async function load(){
  if(!bid && !hintedProduct){showError('العرض غير موجود');return}
  // Prefer live banner data. If that endpoint is unavailable on a serverless deployment,
  // use the product/price embedded in the banner link as a display fallback. Checkout still
  // validates bannerId + live offer price on the server, so the fallback cannot authorize a fake offer.
  try{
    if(bid){
      const d=await fetchJson(`${API_URL}/banners/${encodeURIComponent(bid)}`);
      if(!d?.ok||!d.banner) throw Error(d?.error||'العرض غير موجود');
      b=d.banner;
    }
  }catch(e){
    if(!hintedProduct){throw Error(e.name==='AbortError'?'انتهت مهلة تحميل العرض':'تعذر تحميل بيانات العرض');}
    b={id:bid,productId:hintedProduct,offerPrice:hintedPrice,offerColor:hintedColor};
  }
  if(!b.productId) throw Error('لم يتم ربط هذا البانر بمنتج');
  if(!(Number(b.offerPrice)>0) && !(hintedPrice>0)) throw Error('سعر العرض غير محدد');
  if(!(Number(b.offerPrice)>0)) b.offerPrice=hintedPrice;
  const pd=await fetchJson(`${API_URL}/products/${encodeURIComponent(b.productId)}`);
  if(!pd?.ok||!pd.product) throw Error(pd?.error||'المنتج غير موجود');
  p=pd.product;
  $('#offerName').textContent=p.name||'منتج AXEL';
  $('#offerPrice').textContent=money(b.offerPrice);
  const color=b.offerColor||hintedColor||p.colors?.[0]||p.images?.find(x=>x.color)?.color||'';
  const imgs=(p.images||[]).filter(x=>!x.color||x.color===color);
  $('#offerImage').src=(imgs[0]||p.images?.[0])?.url||'';
  size=(p.sizes||['M','L','XL','XXL']).find(z=>Number(p.stock?.[color]?.[z]||0)>0)||p.sizes?.[0]||'M';
  render();
}
$('#applyOfferCoupon').onclick=()=>validateCoupon();
$('#offerBuy').onclick=async()=>{
  if(!(await validateCoupon()))return;
  location.href=`checkout.html?id=${encodeURIComponent(p.id)}&color=${encodeURIComponent(b.offerColor||hintedColor||p.colors?.[0]||'')}&size=${encodeURIComponent(size)}&quantity=1&bannerId=${encodeURIComponent(bid)}&coupon=${encodeURIComponent(coupon)}`;
};
load().catch(e=>showError(e.message||'تعذر تحميل العرض'));
</script>
