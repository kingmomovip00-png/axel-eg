<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d1d1b"><title>AXEL | إتمام الطلب</title><link rel="stylesheet" href="css/style.css"></head><body class="checkout-page"><div class="inner-topbar"><button class="page-back" type="button" onclick="if(history.length>1)history.back();else location.href='index.html'" aria-label="رجوع">‹</button></div><div id="axelSplash" class="axel-splash"><img src="assets/logo/logo.png" alt="AXEL"><div class="splash-typing">Welcome to AXEL</div></div><div class="form-wrap"><form id="checkoutForm" class="form-card checkout-card"><div class="checkout-head"><img src="assets/logo/logo.png" class="brand-logo" alt="AXEL"><h1>إتمام الطلب</h1><p>أدخل بياناتك واختر طريقة الدفع</p></div><div id="orderSummary"></div><div class="checkout-section"><h3>بيانات العميل</h3><div class="form-row"><div><label>الاسم بالكامل<input id="customerName" required autocomplete="name"></label></div><div><label>رقم الهاتف<input id="phone" required inputmode="tel" autocomplete="tel"></label></div></div><label>البريد الإلكتروني<input id="email" required type="email" autocomplete="email"></label><label>العنوان بالتفصيل<textarea id="address" required autocomplete="street-address"></textarea></label></div><div class="checkout-section"><h3>كود الخصم</h3><div class="coupon-box"><label>الكود</label><input id="checkoutCoupon" placeholder="اكتب الكود"><button id="applyCheckoutCoupon" class="btn secondary" type="button">تطبيق</button><small id="checkoutCouponMsg"></small></div></div><div class="checkout-section"><h3>طريقة الدفع</h3><div id="paymentMethods" class="payment-methods"><p class="payment-loading">جاري تحميل طرق الدفع...</p></div><small id="paymentHelp" class="payment-help" aria-live="polite"></small></div><div class="checkout-total" id="checkoutTotal"></div><button class="btn checkout-submit" id="submitOrder" type="submit">تأكيد الطلب</button><div id="checkoutMsg" class="checkout-message" role="status"></div><div id="successActions" class="checkout-actions hidden"><button type="button" class="btn" id="copyOrder">نسخ كود الطلب</button><a class="btn secondary" href="index.html">العودة للموقع</a></div></form></div><script src="js/splash.js"></script><script type="module">import {API_URL,SHIPPING_PRICE} from './js/config.js';const q=new URLSearchParams(location.search),KEY='axelCartV1',singleId=q.get('id'),singleColor=q.get('color'),singleSize=q.get('size'),singleQty=Math.max(1,Number(q.get('quantity')||1)),singleBanner=q.get('bannerId')||'',initialCoupon=q.get('coupon')||'';let cart=[],coupon=initialCoupon,lastCode='',baseSubtotal=0,discount=0,paymentMethods=[];const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat('ar-EG',{maximumFractionDigits:0}).format(Number(n||0))+' ج',esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function msg(t,e=false){const x=$('#checkoutMsg');x.textContent=t;x.classList.toggle('error',e)}async function loadPaymentMethods(){const box=$('#paymentMethods'),help=$('#paymentHelp');try{const r=await fetch(`${API_URL}/kashier/payment-methods`),d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||'تعذر تحميل طرق الدفع');paymentMethods=d.methods||[];if(!d.configured){box.innerHTML='<div class="payment-empty">طرق الدفع غير متاحة حاليًا</div>';help.textContent='';return}if(!paymentMethods.length){box.innerHTML='<div class="payment-empty">لا توجد طرق دفع مفعلة على حساب Kashier حاليًا.</div>';help.textContent='';return}box.innerHTML=paymentMethods.map(m=>`<label class="payment-option"><input type="radio" name="paymentChoice" value="${esc(m.id)}" required><span class="payment-copy"><b>${esc(m.title)}</b><small>${esc(m.subtitle)}</small></span><span class="payment-icons"><img src="${esc(m.icon)}" alt=""></span></label>`).join('');}catch(e){box.innerHTML=`<div class="payment-empty error">${esc(e.message||'تعذر تحميل طرق الدفع')}</div>`;}}
function getCart(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function saveCart(c){localStorage.setItem(KEY,JSON.stringify(c))}function render(){const qty=cart.reduce((a,x)=>a+Number(x.quantity||0),0);baseSubtotal=cart.reduce((a,x)=>a+Number(x.unitPrice||0)*Number(x.quantity||0),0);$('#orderSummary').innerHTML=`<div class="order-summary"><div><b>${cart.length} منتجات في السلة</b><span>${qty} قطعة</span></div><strong>${money(baseSubtotal)}</strong></div>${cart.map(x=>`<div class="checkout-item"><img src="${esc(x.imageUrl||'')}" alt=""><span>${esc(x.productName)} — ${esc(x.color)} — ${esc(x.size)} × ${Number(x.quantity||1)}</span><b>${money(Number(x.unitPrice||0)*Number(x.quantity||0))}</b></div>`).join('')}`;renderTotal()}function renderTotal(){const total=Math.max(0,baseSubtotal-discount+Number(SHIPPING_PRICE||0));$('#checkoutTotal').innerHTML=`<div><span>المنتجات</span><b>${money(baseSubtotal)}</b></div><div><span>الشحن</span><b>${money(SHIPPING_PRICE)}</b></div><div><span>الخصم</span><b>-${money(discount)}</b></div><div><span>الإجمالي</span><b>${money(total)}</b></div>`}async function applyCoupon(){const code=$('#checkoutCoupon').value.trim()||coupon;if(!code){coupon='';discount=0;$('#checkoutCouponMsg').textContent='';renderTotal();return true}const qty=cart.reduce((a,x)=>a+Number(x.quantity||0),0);const r=await fetch(`${API_URL}/coupons/validate?code=${encodeURIComponent(code)}&subtotal=${baseSubtotal}&quantity=${qty}`),d=await r.json();if(!r.ok||!d.ok){coupon='';discount=0;$('#checkoutCouponMsg').textContent=d.error||'الكود غير صالح';renderTotal();return false}coupon=code.toUpperCase();discount=Number(d.coupon.discount||0);$('#checkoutCouponMsg').textContent=`تم تطبيق خصم ${money(discount)}`;renderTotal();return true}async function load(){if(singleId){cart=[{productId:singleId,color:singleColor,size:singleSize,quantity:singleQty,unitPrice:0,productName:'منتج AXEL',bannerId:singleBanner}];try{const r=await fetch(`${API_URL}/products/${encodeURIComponent(singleId)}`),d=await r.json();if(r.ok&&d.ok){cart[0].productName=d.product.name||'منتج AXEL';cart[0].unitPrice=Number(d.product.salePrice||0);cart[0].imageUrl=d.product.images?.find(x=>x.color===singleColor)?.url||d.product.images?.[0]?.url||'';if(singleBanner){const br=await fetch(`${API_URL}/banners/${encodeURIComponent(singleBanner)}`),bd=await br.json();if(br.ok&&bd.ok&&Number(bd.banner.offerPrice||0)>0)cart[0].unitPrice=Number(bd.banner.offerPrice)}}}catch{}}else cart=getCart();if(!cart.length){msg('السلة فارغة. أضف منتجًا أولاً.',true);$('#submitOrder').disabled=true;return}$('#checkoutCoupon').value=initialCoupon||'';render();if(initialCoupon)await applyCoupon()}$('#applyCheckoutCoupon').onclick=()=>applyCoupon().catch(()=>{discount=0;$('#checkoutCouponMsg').textContent='تعذر التحقق من الكود';renderTotal()});async function pollPayment(code){$('#successActions').classList.add('hidden');msg('جاري تأكيد الدفع من Kashier...');for(let i=0;i<45;i++){await new Promise(r=>setTimeout(r,2000));try{const r=await fetch(`${API_URL}/orders/status?code=${encodeURIComponent(code)}`),d=await r.json();if(!r.ok||!d.ok)continue;if(d.order.paymentStatus==='paid'){saveCart([]);msg(`تم تأكيد الدفع بنجاح ✓
رقم الطلب: ${code}`);$('#successActions').classList.remove('hidden');return}if(d.order.paymentStatus==='failed'){msg('لم يتم الدفع أو تم رفض العملية. لن يتم اعتماد الطلب.',true);$('#successActions').classList.remove('hidden');return}}catch{}}msg('لم يصل تأكيد نهائي من Paymob بعد. لا تعتبر العملية ناجحة إلا بعد ظهور تأكيد الدفع.')}$('#checkoutForm').onsubmit=async e=>{e.preventDefault();if(!cart.length)return;const btn=$('#submitOrder');btn.disabled=true;msg('جاري إنشاء الطلب...');try{if(!(await applyCoupon()))throw Error('كود الخصم غير صالح');const paymentMethod=document.querySelector('input[name="paymentChoice"]:checked')?.value||'';if(!paymentMethod)throw Error('اختر طريقة الدفع أولاً');const payload={items:cart.map(x=>({productId:x.productId,color:x.color,size:x.size,quantity:x.quantity,bannerId:x.bannerId||''})),customerName:$('#customerName').value.trim(),phone:$('#phone').value.trim(),email:$('#email').value.trim(),address:$('#address').value.trim(),paymentMethod,couponCode:coupon};const r=await fetch(`${API_URL}/orders`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'فشل إنشاء الطلب');lastCode=d.orderCode;if(paymentMethod==='card'||paymentMethod==='wallet'){msg('جاري تحويلك إلى Kashier لإتمام الدفع...');const pr=await fetch(`${API_URL}/kashier/checkout`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:d.orderId,method:paymentMethod})}),pd=await pr.json();if(!pr.ok||!pd.ok)throw Error(pd.error||'تعذر تشغيل بوابة Kashier');location.href=pd.checkoutUrl;return}saveCart([]);msg(`تم إنشاء الطلب بنجاح ✓
رقم الطلب: ${lastCode}`);$('#successActions').classList.remove('hidden')}catch(err){msg(err.message||'حدث خطأ غير متوقع',true)}finally{btn.disabled=false}};$('#copyOrder').onclick=async()=>{try{await navigator.clipboard.writeText(lastCode);$('#copyOrder').textContent='تم النسخ ✓';setTimeout(()=>$('#copyOrder').textContent='نسخ كود الطلب',1800)}catch{msg('رقم الطلب: '+lastCode)}};const returned=q.get('order');if(q.get('payment')==='return'&&returned){lastCode=returned;pollPayment(returned)}loadPaymentMethods();load();</script></body></html>
