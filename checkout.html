<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d1d1b"><title>AXEL | إتمام الطلب</title><link rel="stylesheet" href="css/style.css"></head><body class="checkout-page"><div id="axelSplash" class="axel-splash"><img src="assets/logo/logo.png" alt="AXEL"><div class="splash-typing">Welcome to AXEL</div></div><div class="form-wrap"><form id="checkoutForm" class="form-card checkout-card"><div class="checkout-head"><img src="assets/logo/logo.png" class="brand-logo" alt="AXEL"><h1>إتمام الطلب</h1><p>أدخل بياناتك واختر طريقة الدفع</p></div><div id="orderSummary"></div><div class="checkout-section"><h3>بيانات العميل</h3><div class="form-row"><div><label>الاسم بالكامل<input id="customerName" required autocomplete="name"></label></div><div><label>رقم الهاتف<input id="phone" required inputmode="tel" autocomplete="tel"></label></div></div><label>البريد الإلكتروني<input id="email" required type="email" autocomplete="email"></label><label>العنوان بالتفصيل<textarea id="address" required autocomplete="street-address"></textarea></label></div><div class="checkout-section"><h3>كود الخصم</h3><div class="coupon-box"><label>الكود</label><input id="checkoutCoupon" placeholder="اكتب الكود"><button id="applyCheckoutCoupon" class="btn secondary" type="button">تطبيق</button><small id="checkoutCouponMsg"></small></div></div><div class="checkout-section"><h3>طريقة الدفع</h3><div class="payment-methods"><label class="payment-option"><input type="radio" name="paymentChoice" value="Kashier-card" required><span class="payment-copy"><b>فيزا / ماستركارد</b><small>دفع آمن عبر Kashier مع التحقق 3-D Secure</small></span><span class="payment-icons cards"><img src="assets/icons/visa.svg" alt="Visa"><img src="assets/icons/mastercard.svg" alt="Mastercard"><img src="assets/icons/meeza.svg" alt="Meeza"></span></label><label class="payment-option"><input type="radio" name="paymentChoice" value="Kashier-wallet"><span class="payment-copy"><b>المحافظ الإلكترونية</b><small>فودافون كاش وأورنج كاش وغيرها حسب ما هو مفعّل على حساب Kashier</small></span><span class="payment-icons"><img src="assets/icons/vodafone-cash.svg" alt="Wallet"></span></label><label class="payment-option" id="paypalOption"><input type="radio" name="paymentChoice" value="PayPal"><span class="payment-copy"><b>PayPal</b><small>يظهر ويعمل فقط بعد إضافة مفاتيح PayPal في Vercel</small></span><span class="payment-icons"><img src="assets/icons/paypal.svg" alt="PayPal"></span></label></div></div><div class="checkout-total" id="checkoutTotal"></div><button class="btn checkout-submit" id="submitOrder" type="submit">تأكيد الطلب</button><div id="checkoutMsg" class="checkout-message" role="status"></div><div id="successActions" class="checkout-actions hidden"><button type="button" class="btn" id="copyOrder">نسخ كود الطلب</button><a class="btn secondary" href="index.html">العودة للموقع</a></div></form></div><script src="js/splash.js"></script><script type="module">
import {API_URL,SHIPPING_PRICE} from './js/config.js';
const q=new URLSearchParams(location.search),KEY='axelCartV1',singleId=q.get('id'),singleColor=q.get('color'),singleSize=q.get('size'),singleQty=Math.max(1,Number(q.get('quantity')||1)),singleBanner=q.get('bannerId')||'',initialCoupon=q.get('coupon')||'';let cart=[],coupon=initialCoupon,lastCode='',baseSubtotal=0,discount=0;
const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat('ar-EG',{maximumFractionDigits:0}).format(Number(n||0))+' ج',esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function msg(t,e=false){const x=$('#checkoutMsg');x.textContent=t;x.classList.toggle('error',e)}function getCart(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function saveCart(c){localStorage.setItem(KEY,JSON.stringify(c))}
function render(){const qty=cart.reduce((a,x)=>a+Number(x.quantity||0),0);baseSubtotal=cart.reduce((a,x)=>a+Number(x.unitPrice||0)*Number(x.quantity||0),0);$('#orderSummary').innerHTML=`<div class="order-summary"><div><b>${cart.length} منتجات في السلة</b><span>${qty} قطعة</span></div><strong>${money(baseSubtotal)}</strong></div>${cart.map(x=>`<div class="checkout-item"><img src="${esc(x.imageUrl||'')}" alt=""><span>${esc(x.productName)} — ${esc(x.color)} — ${esc(x.size)} × ${Number(x.quantity||1)}</span><b>${money(Number(x.unitPrice||0)*Number(x.quantity||0))}</b></div>`).join('')}`;renderTotal()}
function renderTotal(){const total=Math.max(0,baseSubtotal-discount+Number(SHIPPING_PRICE||0));$('#checkoutTotal').innerHTML=`<div><span>المنتجات</span><b>${money(baseSubtotal)}</b></div><div><span>الشحن</span><b>${money(SHIPPING_PRICE)}</b></div><div><span>الخصم</span><b>-${money(discount)}</b></div><div><span>الإجمالي</span><b>${money(total)}</b></div>`}
async function applyCoupon(){const code=$('#checkoutCoupon').value.trim()||coupon;if(!code){coupon='';discount=0;$('#checkoutCouponMsg').textContent='';renderTotal();return true}const items=cart.map(x=>({productId:x.productId,unitPrice:Number(x.unitPrice||0),quantity:Number(x.quantity||1)}));const qty=items.reduce((a,x)=>a+x.quantity,0);const r=await fetch(`${API_URL}/coupons/validate?code=${encodeURIComponent(code)}&subtotal=${baseSubtotal}&quantity=${qty}&items=${encodeURIComponent(JSON.stringify(items))}`),d=await r.json();if(!r.ok||!d.ok){coupon='';discount=0;$('#checkoutCouponMsg').textContent=d.error||'الكود غير صالح';renderTotal();return false}coupon=code.toUpperCase();discount=Number(d.coupon.discount||0);$('#checkoutCouponMsg').textContent=`تم تطبيق خصم ${money(discount)}`;renderTotal();return true}
async function load(){if(singleId){cart=[{productId:singleId,color:singleColor,size:singleSize,quantity:singleQty,unitPrice:0,productName:'منتج AXEL',bannerId:singleBanner}];try{const r=await fetch(`${API_URL}/products/${encodeURIComponent(singleId)}`),d=await r.json();if(r.ok&&d.ok){cart[0].productName=d.product.name||'منتج AXEL';cart[0].unitPrice=Number(d.product.salePrice||0);cart[0].imageUrl=d.product.images?.find(x=>x.color===singleColor)?.url||d.product.images?.[0]?.url||'';if(singleBanner){const br=await fetch(`${API_URL}/banners/${encodeURIComponent(singleBanner)}`),bd=await br.json();if(br.ok&&bd.ok&&Number(bd.banner.offerPrice||0)>0)cart[0].unitPrice=Number(bd.banner.offerPrice)}}}catch{}}else cart=getCart();if(!cart.length){msg('السلة فارغة. أضف منتجًا أولاً.',true);$('#submitOrder').disabled=true;return}$('#checkoutCoupon').value=initialCoupon||'';render();if(initialCoupon)await applyCoupon()}
$('#applyCheckoutCoupon').onclick=()=>applyCoupon().catch(()=>{discount=0;$('#checkoutCouponMsg').textContent='تعذر التحقق من الكود';renderTotal()});
async function finishPaid(code){saveCart([]);msg(`تم تأكيد الدفع بنجاح ✓\nرقم الطلب: ${code}`);$('#successActions').classList.remove('hidden')}
async function pollKashier(code){$('#successActions').classList.add('hidden');msg('جاري التحقق من عملية الدفع...');for(let i=0;i<45;i++){await new Promise(r=>setTimeout(r,2000));try{const r=await fetch(`${API_URL}/kashier/status?code=${encodeURIComponent(code)}`),d=await r.json();if(d.paymentStatus==='paid'){await finishPaid(code);return}if(d.paymentStatus==='failed'){msg('لم يتم الدفع أو تم رفض العملية. لم يتم اعتماد الطلب.',true);$('#successActions').classList.remove('hidden');return}}catch{}}msg('لم يصل تأكيد الدفع بعد. لا تعتبر الطلب مدفوعًا إلا بعد ظهور تأكيد الدفع.',true)}
async function startPayment(orderId,code,method){if(method==='PayPal'){msg('جاري تحويلك إلى PayPal...');const r=await fetch(`${API_URL}/paypal/create`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'تعذر تشغيل PayPal');location.href=d.checkoutUrl;return}const gatewayMethod=method==='Kashier-wallet'?'wallet':'card';msg(`جاري تحويلك إلى Kashier للدفع ${gatewayMethod==='wallet'?'بالمحفظة':'بالبطاقة'}...`);const r=await fetch(`${API_URL}/kashier/checkout`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId,method:gatewayMethod})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'تعذر تشغيل بوابة Kashier');location.href=d.checkoutUrl}
$('#checkoutForm').onsubmit=async e=>{e.preventDefault();if(!cart.length)return;const btn=$('#submitOrder');btn.disabled=true;msg('جاري إنشاء الطلب...');try{if(!(await applyCoupon()))throw Error('كود الخصم غير صالح');const paymentMethod=document.querySelector('input[name="paymentChoice"]:checked')?.value||'';if(!paymentMethod)throw Error('اختر طريقة الدفع أولاً');const payload={items:cart.map(x=>({productId:x.productId,color:x.color,size:x.size,quantity:x.quantity,bannerId:x.bannerId||''})),customerName:$('#customerName').value.trim(),phone:$('#phone').value.trim(),email:$('#email').value.trim(),address:$('#address').value.trim(),paymentMethod:paymentMethod==='PayPal'?'PayPal':'Kashier',couponCode:coupon};const r=await fetch(`${API_URL}/orders`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'فشل إنشاء الطلب');lastCode=d.orderCode;await startPayment(d.orderId,lastCode,paymentMethod)}catch(err){msg(err.message||'حدث خطأ غير متوقع',true);btn.disabled=false}};
$('#copyOrder').onclick=async()=>{try{await navigator.clipboard.writeText(lastCode);$('#copyOrder').textContent='تم النسخ ✓';setTimeout(()=>$('#copyOrder').textContent='نسخ كود الطلب',1800)}catch{msg('رقم الطلب: '+lastCode)}};
fetch(`${API_URL}/payment-methods`).then(r=>r.json()).then(cfg=>{if(!cfg.paypal)$('#paypalOption')?.remove();if(!cfg.kashier){document.querySelectorAll('input[value^=Kashier]').forEach(x=>x.closest('.payment-option')?.remove())}}).catch(()=>{});const returned=q.get('order');if(q.get('payment')==='kashier'&&returned)pollKashier(returned);if(q.get('payment')==='paypal'&&returned){(async()=>{msg('جاري تأكيد دفع PayPal...');try{const r=await fetch(`${API_URL}/paypal/capture`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderCode:returned})});const d=await r.json();if(d.paymentStatus==='paid')finishPaid(returned);else msg(d.error||'لم يتم تأكيد الدفع',true)}catch{msg('تعذر تأكيد PayPal حالياً',true)}})()}
if(q.get('payment')==='paypal_cancel'){msg('تم إلغاء عملية PayPal. لم يتم اعتماد الدفع.',true)}
load();
</script></body></html>
