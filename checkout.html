<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AXEL | إتمام الطلب</title><link rel="stylesheet" href="css/style.css"></head><body><div class="form-wrap"><form id="checkoutForm" class="form-card"><img src="assets/logo/logo.png" class="brand-logo" alt="AXEL"><span class="eyebrow">AXEL CHECKOUT</span><h2>إتمام الطلب</h2><div id="orderSummary"></div><input id="customerName" required placeholder="الاسم الكامل"><input id="phone" required inputmode="tel" placeholder="رقم الهاتف"><textarea id="address" required placeholder="العنوان بالتفصيل"></textarea><select id="paymentMethod" required><option value="">طريقة الدفع</option><option value="Paymob">بطاقة / بوابة دفع إلكتروني</option><option value="Vodafone Cash">Vodafone Cash</option><option value="InstaPay">InstaPay</option></select><p class="muted">الشحن: 50 جنيه</p><button class="btn" id="submitOrder" type="submit">تأكيد الطلب</button><div id="checkoutMsg" class="checkout-message"></div><div id="successActions" class="checkout-actions hidden"><button type="button" class="btn" id="copyOrder">نسخ كود الطلب</button><a class="btn secondary" href="index.html">رجوع للموقع</a><a class="btn secondary" id="moreProducts" href="index.html#designs">منتجات أخرى</a></div></form></div><script type="module">
import {API_URL,SHIPPING_PRICE} from './js/config.js';
const q=new URLSearchParams(location.search);const id=q.get('id'),color=q.get('color'),size=q.get('size'),quantity=Math.max(1,Number(q.get('quantity')||1));let product=null,lastCode='';const $=s=>document.querySelector(s);const money=n=>new Intl.NumberFormat('ar-EG',{maximumFractionDigits:0}).format(n||0)+' ج';
async function load(){if(!id){$('#checkoutMsg').textContent='المنتج غير موجود.';return}try{const r=await fetch(`${API_URL}/products/${encodeURIComponent(id)}`),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'تعذر تحميل المنتج');product=d.product;const total=Number(product.salePrice||0)*quantity+SHIPPING_PRICE;$('#orderSummary').innerHTML=`<div class="order-summary"><b>${product.name||'منتج AXEL'}</b><span>${color||''} — ${size||''} — الكمية ${quantity}</span><strong>${money(total)}</strong></div>`}catch(e){$('#checkoutMsg').textContent=e.message}}
$('#checkoutForm').onsubmit=async e=>{e.preventDefault();if(!product)return;$('#submitOrder').disabled=true;$('#checkoutMsg').textContent='جاري إنشاء الطلب...';try{const r=await fetch(`${API_URL}/orders`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:id,color,size,quantity,customerName:$('#customerName').value.trim(),phone:$('#phone').value.trim(),address:$('#address').value.trim(),paymentMethod:$('#paymentMethod').value})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'فشل إنشاء الطلب');lastCode=d.orderCode;$('#checkoutMsg').innerHTML=`<strong>تم إنشاء طلبك بنجاح</strong><br>رقم الطلب: <b>${lastCode}</b><br>احتفظ به لتتبع طلبك.`;$('#submitOrder').classList.add('hidden');$('#successActions').classList.remove('hidden');}catch(err){$('#checkoutMsg').textContent=err.message}finally{$('#submitOrder').disabled=false}};
$('#copyOrder').onclick=async()=>{try{await navigator.clipboard.writeText(lastCode);$('#copyOrder').textContent='تم نسخ الكود ✓';setTimeout(()=>$('#copyOrder').textContent='نسخ كود الطلب',1800)}catch{$('#checkoutMsg').textContent='لم نتمكن من النسخ تلقائيًا، رقم الطلب: '+lastCode}};load();
</script></body></html>
