<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d1d1b">
<title>AXEL | إتمام الطلب</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="form-wrap">
  <form id="checkoutForm" class="form-card checkout-card">
    <img src="assets/logo/logo.png" class="brand-logo" alt="AXEL">
    <span class="eyebrow">AXEL CHECKOUT</span>
    <h2>إتمام الطلب</h2>
    <div id="orderSummary"></div>
    <label for="customerName">الاسم الكامل</label>
    <input id="customerName" required autocomplete="name" placeholder="اكتب اسمك بالكامل">
    <label for="phone">رقم الهاتف</label>
    <input id="phone" required inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx">
    <label for="email">البريد الإلكتروني</label>
    <input id="email" required type="email" autocomplete="email" placeholder="example@email.com">
    <label for="address">العنوان بالتفصيل</label>
    <textarea id="address" required autocomplete="street-address" placeholder="المحافظة - المنطقة - الشارع - رقم المبنى"></textarea>
    <label>طريقة الدفع</label>
    <div class="payment-methods" id="paymentMethods">
      <label class="payment-option">
        <input type="radio" name="paymentChoice" value="Paymob" required>
        <span class="payment-icon"><img src="assets/icons/paymob.svg" alt=""></span>
        <span>الدفع الإلكتروني</span>
      </label>
      <label class="payment-option">
        <input type="radio" name="paymentChoice" value="Vodafone Cash">
        <span class="payment-icon"><img src="assets/icons/vodafone-cash.svg" alt=""></span>
        <span>فودافون كاش</span>
      </label>
      <label class="payment-option">
        <input type="radio" name="paymentChoice" value="InstaPay">
        <span class="payment-icon"><img src="assets/icons/instapay.svg" alt=""></span>
        <span>إنستاباي</span>
      </label>
    </div>
    <div class="accepted-payments" aria-label="طرق الدفع الإلكتروني المتاحة">
      <span>بطاقات الدفع</span>
      <img src="assets/icons/visa.svg" alt="Visa">
      <img src="assets/icons/mastercard.svg" alt="Mastercard">
      <img src="assets/icons/meeza.svg" alt="Meeza">
    </div>
    <p class="muted checkout-note">الشحن: 50 جنيه</p>
    <button class="btn checkout-submit" id="submitOrder" type="submit">تأكيد الطلب</button>
    <div id="checkoutMsg" class="checkout-message" role="status"></div>
    <div id="successActions" class="checkout-actions hidden">
      <button type="button" class="btn" id="copyOrder">نسخ كود الطلب</button>
      <a class="btn secondary" href="index.html">رجوع للموقع</a>
      <a class="btn secondary" id="moreProducts" href="index.html#designs">منتجات أخرى</a>
    </div>
  </form>
</div>
<script type="module">
import {API_URL,SHIPPING_PRICE} from './js/config.js';
const q=new URLSearchParams(location.search);
const id=q.get('id'), color=q.get('color'), size=q.get('size'), quantity=Math.max(1,Number(q.get('quantity')||1));
let product=null,lastCode='';
const $=s=>document.querySelector(s);
const money=n=>new Intl.NumberFormat('ar-EG',{maximumFractionDigits:0}).format(n||0)+' ج';
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function msg(text,error=false){const el=$('#checkoutMsg');el.textContent=text;el.classList.toggle('error',error)}
async function load(){
  if(!id){msg('المنتج غير موجود.',true);return}
  try{
    const r=await fetch(`${API_URL}/products/${encodeURIComponent(id)}`),d=await r.json();
    if(!r.ok||!d.ok)throw new Error(d.error||'تعذر تحميل المنتج');
    product=d.product;
    const total=Number(product.salePrice||0)*quantity+SHIPPING_PRICE;
    $('#orderSummary').innerHTML=`<div class="order-summary"><b>${esc(product.name||'منتج AXEL')}</b><span>${esc(color||'')} — ${esc(size||'')} — الكمية ${quantity}</span><strong>${money(total)}</strong></div>`;
  }catch(e){msg(e.message,true)}
}
async function pollPayment(code){
  for(let i=0;i<30;i++){
    await new Promise(r=>setTimeout(r,2000));
    try{
      const r=await fetch(`${API_URL}/orders/status?code=${encodeURIComponent(code)}`),d=await r.json();
      if(!r.ok||!d.ok)continue;
      if(d.order.paymentStatus==='paid'){
        msg('تم تأكيد الدفع بنجاح ✓');
        $('#successActions').classList.remove('hidden');
        return;
      }
      if(d.order.paymentStatus==='failed'){
        msg('لم يتم تأكيد الدفع. يمكنك المحاولة مرة أخرى.',true);
        $('#successActions').classList.remove('hidden');
        return;
      }
    }catch{}
  }
  msg('عملية الدفع ما زالت قيد التحقق. احتفظ بكود الطلب ويمكنك متابعة حالته لاحقًا.');
  $('#successActions').classList.remove('hidden');
}
$('#checkoutForm').onsubmit=async e=>{
  e.preventDefault();
  if(!product)return;
  const btn=$('#submitOrder');btn.disabled=true;msg('جاري إنشاء الطلب...');
  try{
    const paymentMethod=document.querySelector('input[name="paymentChoice"]:checked')?.value || '';
    const payload={productId:id,color,size,quantity,customerName:$('#customerName').value.trim(),phone:$('#phone').value.trim(),email:$('#email').value.trim(),address:$('#address').value.trim(),paymentMethod};
    const r=await fetch(`${API_URL}/orders`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'فشل إنشاء الطلب');
    lastCode=d.orderCode;
    if(paymentMethod==='Paymob'){
      msg('جاري تحويلك إلى بوابة الدفع الآمنة...');
      const pr=await fetch(`${API_URL}/paymob/checkout`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:d.orderId})});
      const pd=await pr.json();if(!pr.ok||!pd.ok)throw new Error(pd.error||'تعذر تشغيل بوابة Paymob');
      location.href=pd.checkoutUrl;return;
    }
    msg(`تم إنشاء طلبك بنجاح ✓ رقم الطلب: ${lastCode}`);
    btn.classList.add('hidden');$('#successActions').classList.remove('hidden');
  }catch(err){msg(err.message||'حدث خطأ غير متوقع',true)}finally{btn.disabled=false}
};
$('#copyOrder').onclick=async()=>{try{await navigator.clipboard.writeText(lastCode);$('#copyOrder').textContent='تم نسخ الكود ✓';setTimeout(()=>$('#copyOrder').textContent='نسخ كود الطلب',1800)}catch{msg('رقم الطلب: '+lastCode)}};
const returned=q.get('order');
if(q.get('payment')==='return'&&returned){lastCode=returned;msg('جاري التحقق من حالة الدفع...');$('#successActions').classList.remove('hidden');pollPayment(returned)}
load();
</script>
</body></html>
