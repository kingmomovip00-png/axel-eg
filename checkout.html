<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d1d1b"><title>AXEL | إتمام الطلب</title><link rel="stylesheet" href="css/style.css"></head><body class="checkout-page"><div id="axelSplash" class="axel-splash"><img src="assets/logo/logo.png" alt="AXEL"><div class="splash-typing">Welcome to AXEL</div></div><div class="form-wrap"><form id="checkoutForm" class="form-card checkout-card"><div class="checkout-head"><img src="assets/logo/logo.png" class="brand-logo" alt="AXEL"><h1>إتمام الطلب</h1><p>أدخل بياناتك واختر طريقة الدفع</p></div><div id="orderSummary"></div><div class="checkout-section"><h3>بيانات العميل</h3><div class="form-row"><div><label for="customerName">الاسم بالكامل</label><input id="customerName" required autocomplete="name"></div><div><label for="phone">رقم الهاتف</label><input id="phone" required inputmode="tel" autocomplete="tel"></div></div><label for="email">البريد الإلكتروني</label><input id="email" required type="email" autocomplete="email"><label for="address">العنوان بالتفصيل</label><textarea id="address" required autocomplete="street-address"></textarea></div><div class="checkout-section"><h3>كود الخصم</h3><div class="coupon-box"><label>الكود</label><input id="checkoutCoupon" placeholder="اكتب الكود"><button id="applyCheckoutCoupon" class="btn secondary" type="button">تطبيق</button><small id="checkoutCouponMsg"></small></div></div><div class="checkout-section"><h3>طريقة الدفع</h3><div class="payment-methods"><label class="payment-option"><input type="radio" name="paymentChoice" value="Paymob" required><span class="payment-copy"><b>الدفع الإلكتروني</b><small>بطاقة بنكية بأمان عبر بوابة الدفع</small></span><span class="payment-icons cards"><img src="assets/icons/visa.svg" alt="Visa"><img src="assets/icons/mastercard.svg" alt="Mastercard"><img src="assets/icons/meeza.svg" alt="Meeza"></span></label><label class="payment-option"><input type="radio" name="paymentChoice" value="Vodafone Cash"><span class="payment-copy"><b>فودافون كاش</b><small>الدفع بالمحفظة</small></span><span class="payment-icons"><img src="assets/icons/vodafone-cash.svg" alt="Vodafone Cash"></span></label><label class="payment-option"><input type="radio" name="paymentChoice" value="InstaPay"><span class="payment-copy"><b>إنستاباي</b><small>تحويل فوري</small></span><span class="payment-icons"><img src="assets/icons/instapay.svg" alt="InstaPay"></span></label></div></div><div class="checkout-total" id="checkoutTotal"></div><button class="btn checkout-submit" id="submitOrder" type="submit">تأكيد الطلب</button><div id="checkoutMsg" class="checkout-message" role="status"></div><div id="successActions" class="checkout-actions hidden"><button type="button" class="btn" id="copyOrder">نسخ كود الطلب</button><a class="btn secondary" href="index.html">العودة للموقع</a></div></form></div><script src="js/splash.js"></script><script type="module">import {API_URL,SHIPPING_PRICE} from './js/config.js';const q=new URLSearchParams(location.search),id=q.get('id'),color=q.get('color'),size=q.get('size'),quantity=Math.max(1,Number(q.get('quantity')||1)),bannerId=q.get('bannerId')||'',initialCoupon=q.get('coupon')||'';let product=null,lastCode='',coupon=initialCoupon,banner=null,basePrice=0;const $=s=>document.querySelector(s);const money=n=>new Intl.NumberFormat('ar-EG',{maximumFractionDigits:0}).format(n||0)+' ج';const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function msg(t,e=false){const x=$('#checkoutMsg');x.textContent=t;x.classList.toggle('error',e)}async function applyCoupon(){const code=$('#checkoutCoupon').value.trim()||coupon;if(!code){coupon='';$('#checkoutCouponMsg').textContent='';return true}const sub=basePrice*quantity;const r=await fetch(`${API_URL}/coupons/validate?code=${encodeURIComponent(code)}&subtotal=${sub}`),d=await r.json();if(!r.ok||!d.ok){coupon='';$('#checkoutCouponMsg').textContent=d.error||'الكود غير صالح';return false}coupon=code.toUpperCase();$('#checkoutCouponMsg').textContent=`تم تطبيق خصم ${money(d.coupon.discount)}`;return true}async function load(){if(!id){msg('المنتج غير موجود.',true);return}try{const r=await fetch(`${API_URL}/products/${encodeURIComponent(id)}`),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'تعذر تحميل المنتج');product=d.product; if(bannerId){const br=await fetch(`${API_URL}/banners/${encodeURIComponent(bannerId)}`),bd=await br.json(); if(br.ok&&bd.ok) banner=bd.banner;} basePrice=Number(banner?.offerPrice||product.salePrice||0); $('#checkoutCoupon').value=initialCoupon;const sub=basePrice*quantity;$('#orderSummary').innerHTML=`<div class="order-summary"><div><b>${esc(product.name||'منتج AXEL')}</b><span>${esc(color||'')} · ${esc(size||'')} · ${quantity} قطعة</span></div><strong>${money(sub+SHIPPING_PRICE)}</strong></div>`;await applyCoupon();renderTotal()}catch(e){msg(e.message,true)}}function renderTotal(discount=0){const sub=basePrice*quantity;$('#checkoutTotal').innerHTML=`<div><span>المنتجات</span><b>${money(sub)}</b></div><div><span>الشحن</span><b>${money(SHIPPING_PRICE)}</b></div><div><span>الخصم</span><b>-${money(discount)}</b></div><div><span>الإجمالي</span><b>${money(Math.max(0,sub-discount+SHIPPING_PRICE))}</b></div>`}$('#applyCheckoutCoupon').onclick=async()=>{if(await applyCoupon()){const r=await fetch(`${API_URL}/coupons/validate?code=${encodeURIComponent(coupon)}&subtotal=${basePrice*quantity}`);const d=await r.json();renderTotal(d.ok?d.coupon.discount:0)}};async function pollPayment(code){$('#successActions').classList.add('hidden');msg('جاري تأكيد الدفع من Paymob...');for(let i=0;i<45;i++){await new Promise(r=>setTimeout(r,2000));try{const r=await fetch(`${API_URL}/orders/status?code=${encodeURIComponent(code)}`),d=await r.json();if(!r.ok||!d.ok)continue;if(d.order.paymentStatus==='paid'){msg(`تم تأكيد الدفع بنجاح ✓
رقم الطلب: ${code}`);$('#successActions').classList.remove('hidden');return}if(d.order.paymentStatus==='failed'){msg('لم يتم الدفع أو تم رفض العملية. لن يتم اعتماد الطلب.',true);$('#successActions').classList.remove('hidden');return}}catch{}}msg('لم يصل تأكيد نهائي من Paymob بعد. لا تعتبر العملية ناجحة إلا بعد ظهور تأكيد الدفع.')}$('#checkoutForm').onsubmit=async e=>{e.preventDefault();if(!product)return;const btn=$('#submitOrder');btn.disabled=true;msg('جاري إنشاء الطلب...');try{if(!(await applyCoupon()))throw Error('كود الخصم غير صالح');const paymentMethod=document.querySelector('input[name="paymentChoice"]:checked')?.value||'';if(!paymentMethod)throw Error('اختر طريقة الدفع أولاً');const payload={productId:id,color,size,quantity,customerName:$('#customerName').value.trim(),phone:$('#phone').value.trim(),email:$('#email').value.trim(),address:$('#address').value.trim(),paymentMethod,couponCode:coupon,bannerId};const r=await fetch(`${API_URL}/orders`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'فشل إنشاء الطلب');lastCode=d.orderCode;if(paymentMethod==='Paymob'){msg('جاري تحويلك إلى Paymob لإتمام الدفع بالبطاقة...');const pr=await fetch(`${API_URL}/paymob/checkout`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:d.orderId})}),pd=await pr.json();if(!pr.ok||!pd.ok)throw Error(pd.error||'تعذر تشغيل بوابة الدفع');location.href=pd.checkoutUrl;return}msg(`تم إنشاء الطلب بنجاح ✓
رقم الطلب: ${lastCode}`);$('#successActions').classList.remove('hidden')}catch(err){msg(err.message||'حدث خطأ غير متوقع',true)}finally{btn.disabled=false}};$('#copyOrder').onclick=async()=>{try{await navigator.clipboard.writeText(lastCode);$('#copyOrder').textContent='تم النسخ ✓';setTimeout(()=>$('#copyOrder').textContent='نسخ كود الطلب',1800)}catch{msg('رقم الطلب: '+lastCode)}};const returned=q.get('order');if(q.get('payment')==='return'&&returned){lastCode=returned;pollPayment(returned)}load();</script></body></html>
