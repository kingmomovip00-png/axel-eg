<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d1d1b"><title>AXEL | إتمام الطلب</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="checkout-page">
<div class="form-wrap">
  <form id="checkoutForm" class="form-card checkout-card">
    <div class="checkout-head"><img src="assets/logo/logo.png" class="brand-logo" alt="AXEL"><h1>إتمام الطلب</h1><p>أدخل بياناتك واختر طريقة الدفع</p></div>
    <div id="orderSummary"></div>

    <div class="checkout-section">
      <h3>بيانات العميل</h3>
      <div class="form-row"><div><label for="customerName">الاسم بالكامل</label><input id="customerName" required autocomplete="name" placeholder="محمد أحمد"></div>
      <div><label for="phone">رقم الهاتف</label><input id="phone" required inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx"></div></div>
      <label for="email">البريد الإلكتروني</label><input id="email" required type="email" autocomplete="email" placeholder="example@email.com">
      <label for="address">العنوان بالتفصيل</label><textarea id="address" required autocomplete="street-address" placeholder="المحافظة - المنطقة - الشارع - رقم المبنى"></textarea>
    </div>

    <div class="checkout-section">
      <h3>طريقة الدفع</h3>
      <div class="payment-methods" id="paymentMethods">
        <label class="payment-option">
          <input type="radio" name="paymentChoice" value="Paymob" required>
          <span class="payment-copy"><b>الدفع الإلكتروني</b><small>بطاقة بنكية بأمان عبر بوابة الدفع</small></span>
          <span class="payment-icons cards"><img src="assets/icons/visa.svg" alt="Visa"><img src="assets/icons/mastercard.svg" alt="Mastercard"><img src="assets/icons/meeza.svg" alt="Meeza"></span>
        </label>
        <label class="payment-option">
          <input type="radio" name="paymentChoice" value="Vodafone Cash">
          <span class="payment-copy"><b>فودافون كاش</b><small>الدفع بالمحفظة</small></span>
          <span class="payment-icons"><img src="assets/icons/vodafone-cash.svg" alt="Vodafone Cash"></span>
        </label>
        <label class="payment-option">
          <input type="radio" name="paymentChoice" value="InstaPay">
          <span class="payment-copy"><b>إنستاباي</b><small>تحويل فوري</small></span>
          <span class="payment-icons"><img src="assets/icons/instapay.svg" alt="InstaPay"></span>
        </label>
      </div>
    </div>

    <div class="checkout-total" id="checkoutTotal"></div>
    <button class="btn checkout-submit" id="submitOrder" type="submit">تأكيد الطلب</button>
    <div id="checkoutMsg" class="checkout-message" role="status"></div>
    <div id="successActions" class="checkout-actions hidden"><button type="button" class="btn" id="copyOrder">نسخ كود الطلب</button><a class="btn secondary" href="index.html">العودة للموقع</a><a class="btn secondary" href="index.html#designs">منتجات أخرى</a></div>
  </form>
</div>
<script type="module">
import {API_URL,SHIPPING_PRICE} from './js/config.js';
const q=new URLSearchParams(location.search),id=q.get('id'),color=q.get('color'),size=q.get('size'),quantity=Math.max(1,Number(q.get('quantity')||1));
let product=null,lastCode=''; const $=s=>document.querySelector(s);
const money=n=>new Intl.NumberFormat('ar-EG',{maximumFractionDigits:0}).format(n||0)+' ج';
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function msg(t,e=false){const x=$('#checkoutMsg');x.textContent=t;x.classList.toggle('error',e)}
async function load(){if(!id){msg('المنتج غير موجود.',true);return}try{const r=await fetch(`${API_URL}/products/${encodeURIComponent(id)}`),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'تعذر تحميل المنتج');product=d.product;const sub=Number(product.salePrice||0)*quantity,total=sub+SHIPPING_PRICE;$('#orderSummary').innerHTML=`<div class="order-summary"><div><b>${esc(product.name||'منتج AXEL')}</b><span>${esc(color||'')} · ${esc(size||'')} · ${quantity} قطعة</span></div><strong>${money(total)}</strong></div>`;$('#checkoutTotal').innerHTML=`<span>الإجمالي شامل الشحن</span><b>${money(total)}</b>`}catch(e){msg(e.message,true)}}
async function pollPayment(code){$('#successActions').classList.add('hidden');msg('جاري تأكيد الدفع من Paymob...');for(let i=0;i<45;i++){await new Promise(r=>setTimeout(r,2000));try{const r=await fetch(`${API_URL}/orders/status?code=${encodeURIComponent(code)}`),d=await r.json();if(!r.ok||!d.ok)continue;if(d.order.paymentStatus==='paid'){msg(`تم تأكيد الدفع بنجاح ✓\nرقم الطلب: ${code}`);$('#successActions').classList.remove('hidden');return true}if(d.order.paymentStatus==='failed'){msg('لم يتم الدفع أو تم رفض العملية. لن يتم اعتماد الطلب.',true);$('#successActions').classList.remove('hidden');return false}}catch{}}msg('لم يصل تأكيد نهائي من Paymob بعد. لا تعتبر العملية ناجحة إلا بعد ظهور تأكيد الدفع. يمكنك متابعة الطلب لاحقاً.');$('#successActions').classList.remove('hidden');return false}
$('#checkoutForm').onsubmit=async e=>{e.preventDefault();if(!product)return;const btn=$('#submitOrder');btn.disabled=true;msg('جاري إنشاء الطلب...');try{const paymentMethod=document.querySelector('input[name="paymentChoice"]:checked')?.value||'';if(!paymentMethod)throw Error('اختر طريقة الدفع أولاً');const payload={productId:id,color,size,quantity,customerName:$('#customerName').value.trim(),phone:$('#phone').value.trim(),email:$('#email').value.trim(),address:$('#address').value.trim(),paymentMethod};const r=await fetch(`${API_URL}/orders`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'فشل إنشاء الطلب');lastCode=d.orderCode;if(paymentMethod==='Paymob'){msg('جاري تحويلك إلى Paymob لإتمام الدفع بالبطاقة...');const pr=await fetch(`${API_URL}/paymob/checkout`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:d.orderId})}),pd=await pr.json();if(!pr.ok||!pd.ok)throw Error(pd.error||'تعذر تشغيل بوابة الدفع');location.href=pd.checkoutUrl;return}}catch(err){msg(err.message||'حدث خطأ غير متوقع',true)}finally{btn.disabled=false}};
$('#copyOrder').onclick=async()=>{try{await navigator.clipboard.writeText(lastCode);$('#copyOrder').textContent='تم النسخ ✓';setTimeout(()=>$('#copyOrder').textContent='نسخ كود الطلب',1800)}catch{msg('رقم الطلب: '+lastCode)}};const returned=q.get('order');if(q.get('payment')==='return'&&returned){lastCode=returned;pollPayment(returned)}load();
</script></body></html>
