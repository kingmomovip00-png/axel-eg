<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AXEL | إتمام الطلب</title><link rel="stylesheet" href="css/style.css"></head><body><div class="form-wrap"><form id="checkoutForm" class="form-card"><img src="assets/logo/logo.png" class="brand-logo"><h2>إتمام الطلب</h2><div id="orderSummary"></div><input id="customerName" required placeholder="الاسم الكامل"><input id="phone" required inputmode="tel" placeholder="رقم الهاتف"><textarea id="address" required placeholder="العنوان بالتفصيل"></textarea><select id="paymentMethod" required><option value="">طريقة الدفع</option><option value="Paymob">بطاقة / بوابة دفع إلكتروني</option><option value="Vodafone Cash">Vodafone Cash</option><option value="InstaPay">InstaPay</option></select><p>الشحن: 50 جنيه</p><button class="btn" id="submitOrder">تأكيد الطلب</button><p id="checkoutMsg"></p></form></div><script type="module">
import {db} from './js/firebase.js';
import {API_URL,SHIPPING_PRICE} from './js/config.js';
import {doc,getDoc} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';
const q=new URLSearchParams(location.search); const id=q.get('id'), color=q.get('color'), size=q.get('size'); let product=null;
const money=n=>new Intl.NumberFormat('ar-EG',{maximumFractionDigits:0}).format(n||0)+' ج';
if(id){const s=await getDoc(doc(db,'products',id)); if(s.exists()){product={id:s.id,...s.data()}; orderSummary.innerHTML=`<h3>${product.name}</h3><p>${color} - ${size}</p><p>${money(product.salePrice)} + ${money(SHIPPING_PRICE)} شحن</p>`;}}
checkoutForm.onsubmit=async e=>{e.preventDefault(); if(!product)return checkoutMsg.textContent='المنتج غير موجود'; submitOrder.disabled=true; checkoutMsg.textContent='جاري إنشاء الطلب...'; try{const r=await fetch(`${API_URL}/orders`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:id,color,size,quantity:1,customerName:customerName.value,phone:phone.value,address:address.value,paymentMethod:paymentMethod.value})}); const d=await r.json(); if(!r.ok||!d.ok)throw new Error(d.error||'فشل الطلب'); checkoutMsg.innerHTML=`تم إنشاء طلبك بنجاح. رقم الطلب: <b>${d.orderCode}</b>`; submitOrder.style.display='none';}catch(err){checkoutMsg.textContent=err.message;}finally{submitOrder.disabled=false;}};
</script></body></html>
