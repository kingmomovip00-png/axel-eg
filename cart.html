<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AXEL | السلة</title><link rel="stylesheet" href="css/style.css"></head><body><div id="axelSplash" class="axel-splash"><img src="assets/logo/logo.png" alt="AXEL"><div class="splash-typing">Welcome to AXEL</div></div><div class="inner-topbar"><span id="cartCount" class="cart-page-count" aria-label="عدد القطع">0</span><button class="page-back" type="button" onclick="if(history.length>1)history.back();else location.href='index.html'" aria-label="رجوع">‹</button></div><main class="container cart-page"><div class="section-heading"><div><span class="eyebrow">AXEL CART</span><h1>سلة المشتريات</h1></div></div><div id="cartList" class="cart-list"></div><div id="cartEmpty" class="empty-cart hidden"><h2>السلة فارغة</h2><p>أضف المنتجات التي تريدها ثم أكمل الطلب.</p><a class="btn" href="index.html">تصفح المنتجات</a></div><section id="cartSummary" class="cart-summary hidden"><div><span>عدد القطع</span><b id="cartQty">0</b></div><div><span>إجمالي المنتجات</span><b id="cartSubtotal">0 ج</b></div><div><span>الشحن</span><b id="cartShipping">50 ج</b></div><div class="cart-total"><span>الإجمالي</span><b id="cartTotal">0 ج</b></div><a id="goCheckout" class="btn checkout-submit" href="checkout.html?cart=1">إتمام الطلب</a></section></main><footer class="footer"><div class="container footer-inner"><div class="footer-brand"><img src="assets/logo/logo.png" class="footer-logo" alt="AXEL"></div><div class="footer-bottom">Powered by GMV MEDIA</div></div></footer><script src="js/splash.js"></script><script type="module">import {API_URL,SHIPPING_PRICE} from './js/config.js';const KEY='axelCartV1',money=n=>new Intl.NumberFormat('ar-EG',{maximumFractionDigits:0}).format(Number(n||0))+' ج',esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const $=s=>document.querySelector(s);function get(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function save(c){localStorage.setItem(KEY,JSON.stringify(c));render()}function render(){const cart=get(),list=$('#cartList');const countEl=$('#cartCount'); if(countEl) countEl.textContent=cart.reduce((a,x)=>a+Number(x.quantity||0),0);if(!cart.length){list.innerHTML='';$('#cartEmpty').classList.remove('hidden');$('#cartSummary').classList.add('hidden');return}$('#cartEmpty').classList.add('hidden');$('#cartSummary').classList.remove('hidden');list.innerHTML=cart.map((x,i)=>`<article class="cart-item"><img src="${esc(x.imageUrl||'')}" alt="${esc(x.productName||'منتج')}"><div class="cart-item-info"><h3>${esc(x.productName)}</h3><p>${esc(x.color)} · ${esc(x.size)}</p><b>${money(x.unitPrice||0)}</b><div class="cart-qty"><button data-dec="${i}">−</button><strong>${Number(x.quantity||1)}</strong><button data-inc="${i}">+</button></div><button class="cart-remove" data-del="${i}">حذف</button></div></article>`).join('');const qty=cart.reduce((a,x)=>a+Number(x.quantity||0),0),sub=cart.reduce((a,x)=>a+Number(x.unitPrice||0)*Number(x.quantity||0),0);$('#cartQty').textContent=qty;$('#cartSubtotal').textContent=money(sub);$('#cartShipping').textContent=money(SHIPPING_PRICE);$('#cartTotal').textContent=money(sub+Number(SHIPPING_PRICE||0));}$('#cartList').onclick=e=>{const c=get(),d=e.target.closest('[data-dec]'),inc=e.target.closest('[data-inc]'),del=e.target.closest('[data-del]');if(d){const i=+d.dataset.dec;c[i].quantity=Math.max(1,c[i].quantity-1);save(c)}if(inc){const i=+inc.dataset.inc;c[i].quantity=Math.min(Number(c[i].max||20),Number(c[i].quantity||1)+1);save(c)}if(del){c.splice(+del.dataset.del,1);save(c)}};render();window.addEventListener('storage',render);</script></body></html>
